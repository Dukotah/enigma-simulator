name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Data files are reproducible from make_data.py
        run: |
          python make_data.py
          git diff --exit-code -- chains.pickle message_key_encrypts.pickle encrypt1.txt encrypt2.txt encrypt3.txt
      - name: Notebooks execute top to bottom
        run: |
          jupyter nbconvert --to notebook --execute --output-dir /tmp/nb BreakingEnigma.ipynb
          jupyter nbconvert --to notebook --execute --output-dir /tmp/nb MasterEnigmaCracker.ipynb
